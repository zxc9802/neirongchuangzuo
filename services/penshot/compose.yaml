services:
  penshot:
    build:
      context: https://github.com/neopen/story-shot-agent.git#d772931588d8b6147dab5b1d1be7abc395eb29b0
    restart: unless-stopped
    env_file: .env
    environment:
      PENSHOT_API__HOST: 0.0.0.0
      PENSHOT_API__PORT: 8000
      PENSHOT_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - penshot-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - penshot-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  penshot-data:
  penshot-redis:
