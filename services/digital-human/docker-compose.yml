version: "3.8"

services:
  digital-human-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_human_studio
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_BASE_URL=https://lipsync.yourdomain.com
      - INDEXTTS_302_API_KEY=${INDEXTTS_302_API_KEY:?required}
      - INDEXTTS_BASE_URL=${INDEXTTS_BASE_URL:-}
      - INDEXTTS_SPEAKER_AUDIO_URL=${INDEXTTS_SPEAKER_AUDIO_URL:?required}
      - INDEXTTS_EMOTION_AUDIO_URL=${INDEXTTS_EMOTION_AUDIO_URL:-}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY:-}
      - OPENLUX_API_KEY=${OPENLUX_API_KEY:-}
      - PIXVERSE_INGEST_TOKEN=${PIXVERSE_INGEST_TOKEN:-}
      - FAL_KEY=${FAL_KEY:-}
      - LIPSYNC_PROVIDER=${LIPSYNC_PROVIDER:-veed}
      - COS_SECRET_ID=${COS_SECRET_ID:?required}
      - COS_SECRET_KEY=${COS_SECRET_KEY:?required}
      - COS_BUCKET=${COS_BUCKET:?required}
      - COS_REGION=${COS_REGION:?required}
      - COS_CUSTOM_DOMAIN=${COS_CUSTOM_DOMAIN:-}
      - MAIN_APP_SSO_CLIENT_SECRET=${MAIN_APP_SSO_CLIENT_SECRET:?required}
      - APP_SESSION_SECRET=${APP_SESSION_SECRET:?required}
    volumes:
      - ./data/jobs:/app/.runtime/jobs
      - ./data/uploads:/app/.runtime/uploads
      - ./data/state:/app/.runtime/state
