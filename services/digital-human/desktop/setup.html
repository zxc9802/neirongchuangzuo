<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>连接工作室</title><link rel="stylesheet" href="setup.css"></head>
<body><main>
  <div class="brand"><span class="mark">D<span>H</span></span><span>数字人工作室</span><small id="version"></small></div>
  <div class="eyebrow">YOUR PERSONAL CREATIVE STUDIO</div>
  <h1>你的创作空间，<br><span>准备就绪。</span></h1>
  <p class="intro">连接工作室服务，登录你的账号。<br>形象、声音和作品，随时继续。</p>
  <form id="connect-form"><label for="server">工作室服务地址</label><input id="server" type="url" required placeholder="https://studio.example.com" autocomplete="url" spellcheck="false"><p class="hint">填写管理员提供的服务地址，首次连接后会自动保存。</p><p id="error" role="alert" hidden></p><button id="connect" type="submit">连接工作室 <span>↗</span></button></form>
  <footer><span class="dot"></span>连接成功后即可注册或登录</footer>
</main><script src="setup.js"></script></body></html>
