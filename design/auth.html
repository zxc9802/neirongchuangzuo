<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 起芽内容创作</title><link rel="icon" type="image/png" href="/media/qiya-logo.png"><link rel="stylesheet" href="/auth.css"></head>
<body>
<header class="auth-header"><a class="auth-brand" href="/login" aria-label="起芽内容创作登录页"><img src="/media/qiya-logo.png" alt="起芽传媒 Logo" width="380" height="329"><strong>起芽内容创作</strong></a><span>实体生意宣传工作台</span></header>
<main class="auth-layout">
  <section class="auth-story" aria-label="起芽内容创作工作台">
    <div class="auth-story-copy"><p>让创作，成为生意的日常</p><h1>好生意，<br>值得被看见。</h1><span>从真实素材开始，整理文案、制作图片与数字人口播。</span></div>
    <img src="/media/ai-retail-flowers.png" alt="花店陈列创作示例" class="auth-cover">
    <div class="auth-caption"><span>每个生意，都有自己的故事。</span></div>
  </section>
  <section class="auth-panel">
    <p class="auth-eyebrow">欢迎来到起芽内容创作</p><h2 id="auth-title">登录你的工作台</h2><p id="auth-description" class="auth-description">内部账号可使用原账号和密码登录。</p>
    <form id="auth-form">
      <label>账号<input name="account" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="254" placeholder="输入账号"></label>
      <label>密码<span class="password-field"><input name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="128" placeholder="输入密码"><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></span></label>
      <label id="invite-code-field" hidden>邀请码<input name="inviteCode" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="6" maxlength="6" pattern="(?=.*[A-Z])(?=.*[0-9])[A-Z0-9]{6}" placeholder="输入6位邀请码（数字和大写字母）" aria-describedby="auth-description" disabled></label>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button id="auth-submit" class="auth-submit" type="submit">登录并进入工作台 <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch"><span id="switch-description">还没有账号？</span><a id="switch-link" href="/register">邀请码注册</a></p>
    <p class="auth-note" id="auth-note">共用电脑使用后，请退出登录。</p>
  </section>
</main>
<footer class="auth-footer">起芽内容创作 · 让真实的好生意被更多人看见</footer>
<script type="module" src="/auth.js"></script>
</body></html>
