<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><script src="/workspace-preferences-init.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 起芽内容创作</title><link rel="icon" type="image/png" href="/media/qiya-logo.png"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/workspace-theme.css"></head>
<body data-auth-page>
<div id="workspace-preferences" class="workspace-preferences" role="group" aria-label="显示设置">
  <label class="workspace-language-picker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/></svg><select id="workspace-language" aria-label="语言"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="ms" lang="ms">Bahasa Melayu</option><option value="en" lang="en">English</option></select></label>
  <button id="workspace-theme" type="button" class="workspace-theme-toggle" aria-label="切换到深色模式" title="切换到深色模式" aria-pressed="false"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7 13.1A9 9 0 0 1 10.9 3.3a9 9 0 1 0 9.8 9.8Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button>
</div>

<header class="auth-header"><a class="auth-brand" href="/login" aria-label="起芽内容创作登录页"><img src="/media/qiya-logo.png" alt="起芽传媒 Logo" width="380" height="329"><strong>起芽内容创作</strong></a></header>
<main class="auth-layout">
  <section class="auth-story" aria-label="起芽内容创作工作台">
    <div class="auth-story-copy"><h1>好生意，<br>值得被看见。</h1></div>
    <img src="/media/ai-retail-flowers.png" alt="花店陈列创作示例" class="auth-cover">

  </section>
  <section class="auth-panel">
    <h2 id="auth-title">登录你的工作台</h2><p id="auth-description" class="auth-description">内部账号可使用原账号和密码登录。</p>
    <form id="auth-form">
      <label><span id="account-label">手机号 / 用户名</span><input name="account" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="254" placeholder="输入手机号或用户名"></label>
      <label>密码<span class="password-field"><input name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="128" placeholder="输入密码"><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></span></label>
      <label id="invite-code-field" hidden>邀请码<input name="inviteCode" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="6" maxlength="6" pattern="(?=.*[A-Z])(?=.*[0-9])[A-Z0-9]{6}" placeholder="输入6位邀请码（数字和大写字母）" aria-describedby="auth-description" disabled></label>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button id="auth-submit" class="auth-submit" type="submit">登录 <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch"><span id="switch-description">还没有账号？</span><a id="switch-link" href="/register">邀请码注册</a></p>
    <p class="auth-note" id="auth-note">共用电脑使用后，请退出登录。</p>
  </section>
</main>

<script type="module" src="/workspace-preferences.js"></script>
<script type="module" src="/auth.js"></script>
</body></html>
